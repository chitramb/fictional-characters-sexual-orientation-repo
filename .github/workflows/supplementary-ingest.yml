name: Ingest neutral universe-first fictional character sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths:
      - ".github/run-multisource-ingest"
      - ".github/workflows/supplementary-ingest.yml"
      - "src/**"
      - "tests/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: supplementary-character-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ingestion regression tests
        run: python -m unittest discover -s tests -v
      - name: Fetch supplementary source candidates
        run: python -m src.ingest_sources --source all
      - name: Merge available checkpoints
        if: always()
        run: python -m src.merge_candidates
      - name: Audit candidate corpus quality
        if: always()
        run: |
          if [ -f data/processed/character_dictionary.jsonl ]; then
            python -m src.audit_candidates
          else
            echo "No merged dictionary available for audit."
          fi
      - name: Persist character dictionary to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/processed/character_dictionary.jsonl ] && [ -f data/processed/collection_summary.json ]; then
            git pull --rebase origin main
            git add -f data/processed/character_dictionary.jsonl data/processed/collection_summary.json data/processed/quality_audit.json
            if ! git diff --cached --quiet; then
              git commit -m "Refresh universe-first fictional character dictionary"
              git push
            fi
          else
            echo "No completed checkpoint available to persist."
          fi
      - name: Upload source-preserving candidate data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplementary-character-candidates-${{ github.run_number }}
          path: |
            data/raw/supplementary/*
            data/processed/quality_audit.json
          if-no-files-found: warn
          retention-days: 90

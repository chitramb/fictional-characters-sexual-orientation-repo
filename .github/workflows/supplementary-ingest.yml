name: Ingest neutral universe-first fictional character sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths:
      - ".github/run-multisource-ingest"

permissions:
  contents: write

concurrency:
  group: neutral-universe-first-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch supplementary source candidates
        run: python -m src.ingest_sources --source all
      - name: Persist character dictionary to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/character_dictionary.jsonl data/processed/collection_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh universe-first fictional character dictionary"
            git push
          fi
      - name: Upload source-preserving candidate data
        uses: actions/upload-artifact@v4
        with:
          name: supplementary-character-candidates-${{ github.run_number }}
          path: data/raw/supplementary/*
          if-no-files-found: error
          retention-days: 90
